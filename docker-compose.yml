services:
  postgres:
    image: postgres:16
    container_name: flowable-postgres
    environment:
      POSTGRES_DB: flowable
      POSTGRES_USER: flowable
      POSTGRES_PASSWORD: flowable
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  flowable-rest:
    image: flowable/flowable-rest:6.8.0
    container_name: flowable-rest
    depends_on:
      - postgres
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_DRIVER-CLASS-NAME: org.postgresql.Driver
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flowable
      SPRING_DATASOURCE_USERNAME: flowable
      SPRING_DATASOURCE_PASSWORD: flowable
      FLOWABLE_COMMON_APP_IDM-ADMIN_USER: admin
      FLOWABLE_COMMON_APP_IDM-ADMIN_PASSWORD: test
      # Conexión a la BD de la institución para nuestros Delegates/Listeners
      INSTITUCION_DB_URL: jdbc:postgresql://postgres:5432/institucion
      INSTITUCION_DB_USER: institucion
      INSTITUCION_DB_PASS: institucion
    ports:
      - "8080:8080"
    volumes:
      - ./target/cursos-flowable.jar:/app/WEB-INF/lib/cursos-flowable.jar:ro

  flowable-ui:
    image: flowable/flowable-ui:6.8.0
    container_name: flowable-ui
    depends_on:
      - postgres
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_DRIVER-CLASS-NAME: org.postgresql.Driver
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flowable
      SPRING_DATASOURCE_USERNAME: flowable
      SPRING_DATASOURCE_PASSWORD: flowable
      FLOWABLE_COMMON_APP_IDM-URL: http://localhost:8081/flowable-ui
      FLOWABLE_COMMON_APP_IDM-REDIRECT-URL: http://localhost:8081/flowable-ui
      FLOWABLE_COMMON_APP_IDM-ADMIN_USER: admin
      FLOWABLE_COMMON_APP_IDM-ADMIN_PASSWORD: test
      INSTITUCION_DB_URL: jdbc:postgresql://postgres:5432/institucion
      INSTITUCION_DB_USER: institucion
      INSTITUCION_DB_PASS: institucion
    ports:
      - "8081:8080"
    volumes:
      - ./target/cursos-flowable.jar:/app/WEB-INF/lib/cursos-flowable.jar:ro

volumes:
  pgdata: